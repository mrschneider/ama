<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="monospace">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>
  <rect width="900" height="540" fill="#fafafa"/>

  <!-- host -->
  <rect x="20" y="20" width="860" height="120" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="40" y="45" font-size="16" fill="#1a73e8" font-weight="bold">HOST — ama kernel (ama-core)</text>
  <rect x="40" y="60" width="180" height="60" rx="4" fill="#fff" stroke="#999"/>
  <text x="50" y="85" font-size="12">process table</text>
  <text x="50" y="103" font-size="12">UIN/PID/caps/hb</text>
  <rect x="240" y="60" width="180" height="60" rx="4" fill="#fff" stroke="#999"/>
  <text x="250" y="85" font-size="12">IPC router</text>
  <text x="250" y="103" font-size="12">0x0A framing + wire translate</text>
  <rect x="440" y="60" width="180" height="60" rx="4" fill="#fff" stroke="#999"/>
  <text x="450" y="85" font-size="12">append-only ledger</text>
  <text x="450" y="103" font-size="12">checkpoint / respawn source</text>
  <rect x="640" y="60" width="220" height="60" rx="4" fill="#fff8e1" stroke="#f9ab00"/>
  <text x="650" y="85" font-size="12">TCP bridge 0.0.0.0:7777</text>
  <text x="650" y="103" font-size="12">+ per-agent taps ama_tap&lt;1+uin&gt;</text>

  <!-- VMs -->
  <rect x="40" y="170" width="400" height="340" rx="8" fill="#e6f4ea" stroke="#188038"/>
  <text x="60" y="195" font-size="16" fill="#188038" font-weight="bold">MICROVM 1 (uin 1) — firecracker</text>
  <rect x="60" y="210" width="160" height="40" rx="4" fill="#fff" stroke="#188038"/>
  <text x="70" y="235" font-size="12">vmlinux-6.1.155</text>
  <rect x="60" y="260" width="160" height="40" rx="4" fill="#fff" stroke="#188038"/>
  <text x="70" y="285" font-size="12">initramfs (musl agentd)</text>
  <rect x="60" y="310" width="160" height="40" rx="4" fill="#fff" stroke="#188038"/>
  <text x="70" y="335" font-size="12">guest-init.sh (PID 1)</text>
  <rect x="60" y="360" width="160" height="40" rx="4" fill="#fff" stroke="#188038"/>
  <text x="70" y="385" font-size="12">/bin/ama-agentd</text>
  <text x="60" y="430" font-size="11" fill="#188038">VM boundary = the jail</text>
  <text x="60" y="445" font-size="11" fill="#188038">(AMA_VM=1 — no guest seccomp)</text>

  <rect x="460" y="170" width="400" height="340" rx="8" fill="#fce8e6" stroke="#d93025"/>
  <text x="480" y="195" font-size="16" fill="#d93025" font-weight="bold">MICROVM 2 (uin 2) — firecracker</text>
  <rect x="480" y="210" width="160" height="40" rx="4" fill="#fff" stroke="#d93025"/>
  <text x="490" y="235" font-size="12">vmlinux-6.1.155</text>
  <rect x="480" y="260" width="160" height="40" rx="4" fill="#fff" stroke="#d93025"/>
  <text x="490" y="285" font-size="12">initramfs (musl agentd)</text>
  <rect x="480" y="310" width="160" height="40" rx="4" fill="#fff" stroke="#d93025"/>
  <text x="490" y="335" font-size="12">guest-init.sh (PID 1)</text>
  <rect x="480" y="360" width="160" height="40" rx="4" fill="#fff" stroke="#d93025"/>
  <text x="490" y="385" font-size="12">/bin/ama-agentd</text>
  <text x="480" y="430" font-size="11" fill="#d93025">VM boundary = the jail</text>
  <text x="480" y="445" font-size="11" fill="#d93025">isolated tap 172.16.3.0/24</text>

  <!-- network paths -->
  <line x1="750" y1="120" x2="140" y2="170" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <text x="240" y="150" font-size="12" fill="#444">tap 172.16.2.0/24 → host bridge</text>
  <line x1="750" y1="120" x2="560" y2="170" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <text x="660" y="150" font-size="12" fill="#444">tap 172.16.3.0/24 → host bridge</text>

  <text x="40" y="530" font-size="11" fill="#666">SIGKILL = VM dies · respawn = fresh VM from ledger checkpoint · wire contract byte-identical across the VM boundary (experiment 005)</text>
</svg>