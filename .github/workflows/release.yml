name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      # the experiments execute ./target/debug/ama and ./target/debug/ama-agentd,
      # which `cargo test` alone does NOT produce (v0.5.0 release failed here)
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: bash experiments/experiment_001_isolation.sh
      - run: pkill -9 -x ama || true; pkill -9 -x ama-agentd || true; sleep 1
      - run: bash experiments/experiment_002_caps_seccomp.sh
      - run: pkill -9 -x ama || true; pkill -9 -x ama-agentd || true; sleep 1
      - run: bash experiments/experiment_003_transports.sh
      - run: pkill -9 -x ama || true; pkill -9 -x ama-agentd || true; sleep 1
      - run: bash experiments/experiment_004_wires.sh
      - run: pkill -9 -x ama || true; pkill -9 -x ama-agentd || true; sleep 1
      - run: bash experiments/experiment_006_qos_dtn.sh
      - run: pkill -9 -x ama || true; pkill -9 -x ama-agentd || true; sleep 1
      - run: bash experiments/experiment_007_qos_suite.sh

  dist:
    name: dist (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: ama-x86_64-linux-gnu.tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: ama-x86_64-linux-musl.tar.gz
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release --target ${{ matrix.target }}
      - name: stage
        run: |
          mkdir -p stage/vm stage/docs
          cp target/${{ matrix.target }}/release/ama       stage/
          cp target/${{ matrix.target }}/release/ama-agentd stage/
          cp README.md LICENSE CONTRIBUTING.md SECURITY.md stage/
          cp vm/boot_agent.sh vm/assemble_initramfs.sh vm/guest-init.sh stage/vm/
          cp -r experiments stage/experiments
          cp -r docs/assets stage/docs/assets 2>/dev/null || true
      - name: archive
        run: |
          tar czf ${{ matrix.archive }} -C stage .
          sha256sum ${{ matrix.archive }} > ${{ matrix.archive }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  release:
    name: publish GitHub release
    runs-on: ubuntu-latest
    needs: dist
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: checksums
        run: sha256sum -c ./*.sha256
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tar.gz
            *.sha256
