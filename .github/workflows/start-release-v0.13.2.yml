name: Start AMA v0.13.2 release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/start-release-v0.13.2.yml

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version and publish immutable tag
        env:
          TAG: v0.13.2
        run: |
          set -euo pipefail
          grep -q '^version = "0.13.2"$' Cargo.toml
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists; refusing to move it"
            exit 1
          fi
          git tag -a "$TAG" "$GITHUB_SHA" -m "AMA $TAG security hardening"
          git push origin "refs/tags/$TAG"
      - name: Start existing Release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags pushed using GITHUB_TOKEN do not trigger another workflow.
          # Explicitly dispatch the existing release workflow for the new tag.
          gh workflow run release.yml --ref v0.13.2
