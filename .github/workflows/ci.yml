name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --release -- -D warnings
        if: matrix.profile == 'release'

  tests:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace
      # F03: a validator that PRINTS FAIL but exits 0 hides broken guarantees
      # from CI — every experiment validator must fail closed on invalid
      # evidence
      - run: python3 tests/validators_fail_closed.py

  e2e:
    name: e2e experiments
    runs-on: ubuntu-latest
    needs: [fmt, clippy, tests]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      # Kernel behaviour (isolation, watchdog, recovery, hot caps, seccomp
      # jails, TCP transports, three wire formats) — needs a real Linux
      # process model and seccomp, so these only run on ubuntu runners.
      - run: bash experiments/experiment_001_isolation.sh
      - run: bash experiments/experiment_002_caps_seccomp.sh
      - run: bash experiments/experiment_003_transports.sh
      - run: bash experiments/experiment_004_wires.sh
      - run: |
          pkill -9 -x ama || true
          pkill -9 -x ama-agentd || true
          sleep 1
          bash experiments/experiment_006_qos_dtn.sh
      - run: |
          pkill -9 -x ama || true
          pkill -9 -x ama-agentd || true
          sleep 1
          bash experiments/experiment_007_qos_suite.sh
      - run: |
          pkill -9 -x ama || true
          pkill -9 -x ama-agentd || true
          sleep 1
          bash experiments/experiment_008_dtn_routing.sh
      # experiment_005_microvm is intentionally excluded: it requires
      # /dev/kvm, which GitHub-hosted runners do not expose.
