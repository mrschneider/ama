[workspace]
resolver = "2"
members = ["ama-core", "ama-agentd", "ama-cli"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mrschneider/ama"
readme = "README.md"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
libc = "0.2"

[profile.release]
lto = true
strip = true
